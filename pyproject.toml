[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdn-xhttp-setup"
version = "0.2.0"
description = "Configure Ubuntu 22.04/24.04 VPS for VLESS XHTTP through an existing CDN"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["paramiko>=3.5,<6"]

[project.scripts]
cdn-xhttp = "cdn_xhttp.cli:main"

[tool.setuptools.packages.find]
include = ["cdn_xhttp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
